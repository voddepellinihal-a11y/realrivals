services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      APP_NAME: RealLifeRivals
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/real_life_rivals
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: real_life_rivals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
